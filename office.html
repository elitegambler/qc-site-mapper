<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Site Mapper — Office Upload</title>
<style>
  :root{--paper:#0D1520;--card:#18222F;--rule:#28374A;--ink:#E8EEF5;--ink-soft:#8B9AAC;
    --blue:#4C8DFF;--hivis:#D8ED4A;--red:#F08497;--green:#34D399;
    --ui:'Segoe UI',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
  h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:32px;}
  .section{background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:24px;width:100%;max-width:520px;margin-bottom:20px;}
  .section h2{font-size:15px;margin-bottom:12px;color:var(--blue);}
  .drop{border:2px dashed var(--rule);border-radius:8px;padding:32px 16px;text-align:center;
    color:var(--ink-soft);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s;}
  .drop.over{border-color:var(--blue);background:rgba(76,141,255,.08);}
  .drop input{display:none;}
  .file-list{margin-top:16px;display:flex;flex-direction:column;gap:6px;}
  .file-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    background:var(--paper);border-radius:6px;font-size:13px;}
  .file-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px;}
  .file-row .status{font-size:11px;color:var(--green);white-space:nowrap;}
  .file-row .status.err{color:var(--red);}
  .btn{background:var(--blue);color:#08111D;border:none;border-radius:6px;padding:8px 16px;
    font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{opacity:.9;}
  .btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue);}
  .btn.sm{padding:4px 10px;font-size:12px;}
  .btn.red{background:var(--red);color:#08111D;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);
    border:1px solid var(--rule);color:var(--ink);padding:10px 20px;border-radius:8px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;}
  .pass-row{display:flex;gap:8px;margin-bottom:16px;align-items:center;}
  .pass-row input{flex:1;background:var(--paper);border:1px solid var(--rule);color:var(--ink);
    border-radius:6px;padding:8px 12px;font-size:13px;font-family:var(--ui);}
  .pass-row input:focus{outline:none;border-color:var(--blue);}
  .empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:16px 0;}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
</style>
</head>
<body>
  <h1>Office Upload</h1>
  <p class="sub">Upload KMZ files and manage pushed projects — no Python server needed.</p>

  <div class="section">
    <div class="pass-row">
      <input type="password" id="pass" placeholder="Passphrase" value="">
      <button class="btn" id="connectBtn">Connect</button>
    </div>
    <div id="status" style="font-size:12px;color:var(--ink-soft);"></div>
  </div>

  <div class="section" id="kmzSection" style="display:none;">
    <h2>KMZ / KML Files</h2>
    <div class="drop" id="kmzDrop">
      <p>Drag and drop KMZ or KML files here, or click to browse</p>
      <input type="file" id="kmzFile" multiple accept=".kmz,.kml">
    </div>
    <div class="file-list" id="kmzList"></div>
  </div>

  <div class="section" id="projSection" style="display:none;">
    <h2>Pushed Projects</h2>
    <div class="file-list" id="projList"></div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const API = location.origin + '/api';
let pass = '';

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

function headers(extra) {
  return { 'X-Pass': pass, ...extra };
}

async function connect() {
  pass = document.getElementById('pass').value.trim();
  if (!pass) { toast('Enter the passphrase'); return; }
  const st = document.getElementById('status');
  st.textContent = 'Connecting…';
  try {
    const res = await fetch(API + '/kmz', { headers: headers() });
    if (res.status === 401) { st.textContent = 'Wrong passphrase'; return; }
    if (!res.ok) throw new Error(res.status);
    st.textContent = 'Connected';
    st.style.color = 'var(--green)';
    document.getElementById('kmzSection').style.display = '';
    document.getElementById('projSection').style.display = '';
    loadKmz();
    loadProjects();
  } catch (e) {
    st.textContent = 'Could not connect — ' + e.message;
  }
}

document.getElementById('connectBtn').addEventListener('click', connect);
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

// KMZ upload
const kmzDrop = document.getElementById('kmzDrop');
const kmzFile = document.getElementById('kmzFile');
kmzDrop.addEventListener('click', () => kmzFile.click());
kmzDrop.addEventListener('dragover', e => { e.preventDefault(); kmzDrop.classList.add('over'); });
kmzDrop.addEventListener('dragleave', () => kmzDrop.classList.remove('over'));
kmzDrop.addEventListener('drop', e => { e.preventDefault(); kmzDrop.classList.remove('over'); uploadFiles(e.dataTransfer.files); });
kmzFile.addEventListener('change', e => { uploadFiles(e.target.files); e.target.value = ''; });

async function uploadFiles(fileList) {
  for (const file of fileList) {
    try {
      const buf = await file.arrayBuffer();
      const res = await fetch(API + '/kmz/' + encodeURIComponent(file.name), {
        method: 'POST', headers: headers({ 'Content-Type': 'application/octet-stream' }), body: buf
      });
      if (!res.ok) throw new Error(res.status);
      toast('Uploaded ' + file.name);
    } catch (e) {
      toast('Failed: ' + file.name + ' — ' + e.message);
    }
  }
  loadKmz();
}

async function loadKmz() {
  const el = document.getElementById('kmzList');
  try {
    const res = await fetch(API + '/kmz', { headers: headers() });
    const data = await res.json();
    if (!data.files.length) { el.innerHTML = '<div class="empty">No KMZ files uploaded yet</div>'; return; }
    el.innerHTML = data.files.map(f => `
      <div class="file-row">
        <span class="name">${esc(f)}</span>
        <button class="btn sm red" onclick="deleteKmz('${esc(f)}')">Delete</button>
      </div>`).join('');
  } catch (e) { el.innerHTML = '<div class="empty">Error loading list</div>'; }
}

window.deleteKmz = async function(name) {
  if (!confirm('Delete ' + name + '?')) return;
  await fetch(API + '/kmz/' + encodeURIComponent(name), { method: 'DELETE', headers: headers() });
  toast('Deleted ' + name);
  loadKmz();
};

async function loadProjects() {
  const el = document.getElementById('projList');
  try {
    const res = await fetch(API + '/projects/all', { headers: headers() });
    const data = await res.json();
    if (!data.projects || !data.projects.length) { el.innerHTML = '<div class="empty">No projects pushed from the field yet</div>'; return; }
    el.innerHTML = data.projects.map(p => {
      const label = [p.orderNumber, p.name].filter(Boolean).join(' — ') || p.id;
      const status = p.status || 'draft';
      const fname = String(p.id).replace(/[^A-Za-z0-9_\-]/g, '_') + '.json';
      return `<div class="file-row">
        <span class="name">${esc(label)} <span style="color:var(--ink-soft);font-size:11px;">(${esc(status)})</span></span>
        <button class="btn sm ghost" onclick="downloadProj('${esc(fname)}','${esc(label)}')">Download</button>
      </div>`;
    }).join('');
  } catch (e) { el.innerHTML = '<div class="empty">Error loading list</div>'; }
}

window.downloadProj = async function(name, label) {
  const res = await fetch(API + '/projects/' + encodeURIComponent(name), { headers: headers() });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (label || name).replace(/[^A-Za-z0-9 _.\-()]/g, '_') + '.qcproject.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
</script>
</body>
</html>
